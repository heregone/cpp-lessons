name: Package public-site backup

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/package-site-backup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_DIR='areas/personal-site/backups/2026-09-19-live'
          test -f "$ARCHIVE_DIR/manifest.json"
          tar --sort=name --mtime='UTC 2026-09-19' --owner=0 --group=0 --numeric-owner \
            -czf lorenzomontarese.com-2026-09-19-public-backup.tar.gz \
            -C areas/personal-site/backups 2026-09-19-live
          shasum -a 256 lorenzomontarese.com-2026-09-19-public-backup.tar.gz > lorenzomontarese.com-2026-09-19-public-backup.tar.gz.sha256
          du -h lorenzomontarese.com-2026-09-19-public-backup.tar.gz
          cat lorenzomontarese.com-2026-09-19-public-backup.tar.gz.sha256

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: lorenzomontarese-public-backup-2026-09-19
          path: |
            lorenzomontarese.com-2026-09-19-public-backup.tar.gz
            lorenzomontarese.com-2026-09-19-public-backup.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

# Triggered through a direct dev ref update on 2026-09-19.
